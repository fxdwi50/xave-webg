<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebG Studio - 3D Microstock Generator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js & CCapture Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/spite/ccapture.js@v1.0.9/build/CCapture.all.min.js"></script>

    <style>
        /* Mencegah overflow & Memastikan Layout Responsif Fleksibel */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Container Flex Utama */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Column Editor & Form Layout */
        .sidebar-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }

        /* Sticky Header untuk Editor agar tidak pernah hilang saat dipaste */
        .editor-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background-color: #1e293b;
        }

        /* Area Canvas Preview */
        .preview-panel {
            position: relative;
            flex: 1;
            height: 100%;
            background: #000;
        }

        #webgl-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* Watermark / Overlay info */
        .render-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- PANEL KIRI: EDITOR & METADATA -->
    <div class="w-full md:w-5/12 lg:w-4/12 sidebar-panel bg-slate-900 border-r border-slate-800 p-4 space-y-4">
        
        <!-- Header Brand -->
        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
            <h1 class="text-xl font-bold text-indigo-400"><i class="fa-solid fa-cube mr-2"></i>WebG Studio</h1>
            <span class="text-xs bg-indigo-900/50 text-indigo-300 px-2 py-1 rounded">Auto-Render Active</span>
        </div>

        <!-- CODE EDITOR CONTAINER -->
        <div class="flex flex-col rounded-lg border border-slate-700 bg-slate-950 overflow-hidden">
            <div class="editor-header flex justify-between items-center px-3 py-2 border-b border-slate-800">
                <span class="text-xs font-semibold text-slate-400"><i class="fa-solid fa-code mr-1"></i> Three.js / WebGL Code</span>
                <span id="status-tag" class="text-xs text-emerald-400 font-mono">Live Sync</span>
            </div>
            
            <!-- TextArea Editor -->
            <textarea id="code-editor" class="w-full h-48 bg-slate-950 text-emerald-400 font-mono text-xs p-3 focus:outline-none resize-y" placeholder="Paste kode Three.js / HTML 3D Anda di sini..."></textarea>
        </div>

        <!-- METADATA AUTO-EXTRACT -->
        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700 space-y-3">
            <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider"><i class="fa-solid fa-tags mr-1"></i> Microstock Metadata</h2>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">Judul Video (Title)</label>
                <input type="text" id="meta-title" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:border-indigo-500 focus:outline-none" placeholder="Otomatis dari kode...">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Deskripsi</label>
                <textarea id="meta-desc" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:border-indigo-500 focus:outline-none" placeholder="Otomatis dari kode..."></textarea>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Keywords Utama</label>
                <input type="text" id="meta-keywords" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:border-indigo-500 focus:outline-none" placeholder="Otomatis dari kode...">
            </div>
        </div>

        <!-- CONTROL & PRESET SETTINGS -->
        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700 space-y-3">
            <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider"><i class="fa-solid fa-sliders mr-1"></i> Controls & Movement Preset</h2>
            
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Preset Gerakan</label>
                    <select id="preset-motion" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:border-indigo-500 focus:outline-none">
                        <option value="none">Tanpa Preset (Default Kode)</option>
                        <option value="orbit">Slow Orbit Rotate</option>
                        <option value="bounce">Floating Pulse</option>
                        <option value="zoom">Slow Zoom In-Out</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Export Resolution</label>
                    <select id="render-res" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:border-indigo-500 focus:outline-none">
                        <option value="1080">Full HD (1080p)</option>
                        <option value="2160">4K UHD (2160p)</option>
                    </select>
                </div>
            </div>

            <!-- EXPORT RENDER BUTTON -->
            <button id="export-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-lg shadow-lg transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-film"></i>
                <span>Render Video Microstock</span>
            </button>
        </div>

    </div>

    <!-- PANEL KANAN: PREVIEW CANVAS -->
    <div class="preview-panel">
        <div id="iframe-container" class="w-full h-full relative">
            <iframe id="preview-iframe" class="w-full h-full border-0"></iframe>
        </div>

        <!-- Render Loading Overlay -->
        <div id="render-overlay" class="render-overlay hidden">
            <div class="text-center space-y-3">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500"></i>
                <h3 class="text-lg font-bold text-slate-200">Sedang Merekam Video...</h3>
                <p id="render-progress" class="text-xs text-slate-400 font-mono">Frame 0 / 300</p>
            </div>
        </div>
    </div>
</div>

<script>
    const codeEditor = document.getElementById('code-editor');
    const previewIframe = document.getElementById('preview-iframe');
    const metaTitle = document.getElementById('meta-title');
    const metaDesc = document.getElementById('meta-desc');
    const metaKeywords = document.getElementById('meta-keywords');
    const presetMotion = document.getElementById('preset-motion');
    const exportBtn = document.getElementById('export-btn');
    const renderOverlay = document.getElementById('render-overlay');
    const renderProgress = document.getElementById('render-progress');

    let isCapturing = false;

    // 1. DENEUTRALISASI & INJEKSI MASTER AGAR RENDER & PREVIEW 100% SAMA
    function prepareInjectedHTML(rawCode) {
        const preset = presetMotion.value;

        // Script Wrapper untuk memaksa THREE.js menggunakan Deterministic Clock & Preserve Drawing
        const masterEngineInject = `
        <script class="webg-engine">
            (function() {
                // A. Override Date.now & performance.now untuk Sinkronisasi Penuh
                window.__webg_time = 0;
                window.__webg_recording = false;

                const origNow = Date.now;
                const origPerfNow = performance.now.bind(performance);

                Date.now = function() {
                    return window.__webg_recording ? window.__webg_time : origNow();
                };
                performance.now = function() {
                    return window.__webg_recording ? window.__webg_time : origPerfNow();
                };

                // B. Auto Intercept Three.js Renderer saat diinstansiasi di dalam kode
                const checkThreeInterval = setInterval(() => {
                    if (window.THREE) {
                        clearInterval(checkThreeInterval);
                        
                        // Force WebGLRenderer Settings
                        const origRenderer = THREE.WebGLRenderer;
                        THREE.WebGLRenderer = function(options = {}) {
                            options.preserveDrawingBuffer = true; // MANDATORI untuk Capture Canvas
                            options.antialias = true;
                            const renderer = new origRenderer(options);
                            window.__webg_renderer = renderer;
                            return renderer;
                        };
                        Object.assign(THREE.WebGLRenderer, origRenderer);

                        // Injection Movement Preset
                        let angle = 0;
                        const originalRender = THREE.WebGLRenderer.prototype.render;
                        THREE.WebGLRenderer.prototype.render = function(scene, camera) {
                            if ('${preset}' === 'orbit' && camera) {
                                angle += 0.005;
                                camera.position.x = Math.sin(angle) * 5;
                                camera.position.z = Math.cos(angle) * 5;
                                camera.lookAt(scene.position);
                            } else if ('${preset}' === 'bounce' && camera) {
                                angle += 0.02;
                                camera.position.y = 2 + Math.sin(angle) * 0.5;
                            } else if ('${preset}' === 'zoom' && camera) {
                                angle += 0.01;
                                camera.position.z = 4 + Math.sin(angle) * 1.5;
                            }
                            originalRender.apply(this, arguments);
                        };
                    }
                }, 10);
            })();
        <\/script>
        `;

        // Gabungkan Master Inject di bagian atas head/body
        if (rawCode.includes('<head>')) {
            return rawCode.replace('<head>', '<head>' + masterEngineInject);
        } else {
            return masterEngineInject + rawCode;
        }
    }

    // 2. EKSTRAKSI METADATA DARI KODE SECARA OTOMATIS
    function extractMetadata(code) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(code, 'text/html');

        // Extract Title
        const titleTag = doc.querySelector('title')?.innerText;
        const metaTitleTag = doc.querySelector('meta[name="title"]')?.getAttribute('content');
        metaTitle.value = metaTitleTag || titleTag || "3D Abstract Microstock Animation";

        // Extract Description
        const descTag = doc.querySelector('meta[name="description"]')?.getAttribute('content');
        metaDesc.value = descTag || "High quality 3D WebGL animation loop for microstock.";

        // Extract Keywords
        const keyTag = doc.querySelector('meta[name="keywords"]')?.getAttribute('content');
        metaKeywords.value = keyTag || "3d, loop, webgl, background, microstock, motion";
    }

    // 3. AUTO PREVIEW & RESET SCROLL SAAT PASTE / EDIT
    function updatePreview() {
        const rawCode = codeEditor.value;
        if (!rawCode.trim()) return;

        extractMetadata(rawCode);
        const injected = prepareInjectedHTML(rawCode);

        // Update iframe via srcdoc untuk isolasi penuh
        previewIframe.srcdoc = injected;
    }

    // Event Listener Paste & Input
    codeEditor.addEventListener('paste', () => {
        setTimeout(() => {
            codeEditor.scrollTop = 0; // Fix: Kembalikan scroll ke paling atas
            updatePreview();
        }, 50);
    });

    codeEditor.addEventListener('input', () => {
        updatePreview();
    });

    presetMotion.addEventListener('change', updatePreview);

    // 4. SISTEM RENDER VIDEO CCAPTURE LENGKAP
    exportBtn.addEventListener('click', () => {
        const iframeWin = previewIframe.contentWindow;
        const iframeDoc = previewIframe.contentDocument;

        if (!iframeWin || !iframeWin.THREE) {
            alert("Sistem 3D belum siap di preview. Pastikan kode valid!");
            return;
        }

        const canvas = iframeDoc.querySelector('canvas');
        if (!canvas) {
            alert("Canvas 3D tidak ditemukan!");
            return;
        }

        renderOverlay.classList.remove('hidden');

        // Init CCapture
        const capturer = new CCapture({
            format: 'webm',
            framerate: 30,
            verbose: false
        });

        const totalFrames = 300; // 10 Detik
        let currentFrame = 0;

        iframeWin.__webg_recording = true;
        capturer.start();

        function renderFrameStep() {
            if (currentFrame < totalFrames) {
                // Dimajukan 33.3ms per frame (30fps) secara buatan
                iframeWin.__webg_time = currentFrame * (1000 / 30);

                // Re-render scene internal
                if (iframeWin.__webg_renderer) {
                    iframeWin.dispatchEvent(new Event('resize'));
                }

                capturer.capture(canvas); currentFrame++; renderProgress.innerText = `Frame ${currentFrame} / ${totalFrames}`; requestAnimationFrame(renderFrameStep); } else { capturer.stop(); capturer.save((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${metaTitle.value.toLowerCase().replace(/[^a-z0-9]/g, '-')}.webm`;
                    a.click();

                    iframeWin.__webg_recording = false;
                    renderOverlay.classList.add('hidden');
                });
            }
        }

        renderFrameStep();
    });
</script>

</body>
</html>
